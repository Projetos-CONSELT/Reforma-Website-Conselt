<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CONSELT Painel Administrativo</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#071325] text-white font-sans min-h-screen flex flex-col justify-between relative overflow-hidden">

  <!-- Glow de fundo -->
  <div
    class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-[#42A5D3]/10 rounded-full blur-[100px] pointer-events-none">
  </div>

  <header class="p-6">
    <div class="flex items-center gap-3">
      <img src="/conselt-diamond.png" alt="CONSELT" class="w-10 h-10 object-contain" />
      <span class="font-bold text-lg text-white">CONSELT</span>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4 z-10">
    <div
      class="w-full max-w-md bg-[#051D3E]/90 border border-[#42A5D3]/30 rounded-3xl p-8 sm:p-10 shadow-2xl backdrop-blur-xl space-y-6">

      <div class="text-center space-y-2">
        <div
          class="w-12 h-12 mx-auto rounded-2xl bg-[#42A5D3]/15 border border-[#42A5D3]/30 grid place-items-center text-[#42A5D3] mb-3">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-white">Acesso Restrito</h1>
        <p class="text-xs text-[#B1D3E1]">Painel de Gestão e Controle Interno</p>
      </div>

      <div id="error-message"
        class="hidden p-3.5 rounded-xl bg-red-500/15 border border-red-500/30 text-red-200 text-xs"></div>

      <form id="login-form" class="space-y-4">
        <div class="space-y-1">
          <label class="text-xs font-semibold text-[#B1D3E1] block">E-mail corporativo</label>
          <input type="email" id="email" required placeholder="projetos@conselt.com.br"
            class="w-full px-4 py-3 text-sm rounded-xl bg-[#093565]/70 border border-[#42A5D3]/30 text-white placeholder-slate-400 focus:outline-none focus:border-[#42A5D3]" />
        </div>

        <div class="space-y-1">
          <label class="text-xs font-semibold text-[#B1D3E1] block">Senha</label>
          <input type="password" id="password" required placeholder="••••••••"
            class="w-full px-4 py-3 text-sm rounded-xl bg-[#093565]/70 border border-[#42A5D3]/30 text-white placeholder-slate-400 focus:outline-none focus:border-[#42A5D3]" />
        </div>

        <button type="submit" id="submit-btn"
          class="w-full py-3.5 px-4 rounded-xl bg-[#42A5D3] text-[#051D3E] font-bold text-sm hover:bg-[#3492be] transition-all shadow-lg shadow-[#42A5D3]/20 cursor-pointer">
          Entrar no Painel
        </button>
      </form>

      <div class="text-center pt-2">
        <a href="/" class="text-xs text-slate-400 hover:text-[#42A5D3] transition-colors">
          ← Voltar ao site público
        </a>
      </div>

    </div>
  </main>

  <footer class="p-6 text-center text-xs text-slate-500">
    CONSELT — Sistema de Gestão Interna © 2026
  </footer>

  <script type="module">
    import { supabase } from './supabaseClient.js';

    // Verificar se já possui sessão ativa ao abrir /login.html
    async function checkExistingSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.replace('/admin.html');
      }
    }
    checkExistingSession();

    const form = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMessage.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Autenticando...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password,
        });

        if (error) {
          throw error;
        }

        if (data.session) {
          window.location.replace('/admin.html');
        }
      } catch (err) {
        errorMessage.textContent = err.message || 'Falha na autenticação. Verifique e-mail e senha.';
        errorMessage.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar no Painel';
      }
    });
  </script>
</body>

</html>
